# 由 makeserver 生成（ms ci init lumee）。push 到 main 后：构建镜像 → 推到 GitHub 镜像仓库 → 自动部署到服务器
# 自动部署需要先在本机执行一次：ms ci setup lumee
name: makeserver

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: makeserver-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - image: app
            dockerfile: .makeserver/docker/app.Dockerfile
          - image: admin
            dockerfile: .makeserver/docker/admin.Dockerfile
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: 镜像名
        run: |
          echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/lumee-${{ matrix.image }}" >> "$GITHUB_ENV"
          echo "TAG=${GITHUB_SHA::7}" >> "$GITHUB_ENV"
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ env.TAG }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  deploy:
    needs: build
    if: vars.MS_AUTO_DEPLOY == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: 部署到服务器
        env:
          SSH_KEY: ${{ secrets.MS_DEPLOY_KEY }}
          HOST: ${{ secrets.MS_DEPLOY_HOST }}
          PORT: ${{ secrets.MS_DEPLOY_PORT }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy && chmod 600 ~/.ssh/deploy
          ssh -i ~/.ssh/deploy -p "${PORT:-22}" -o StrictHostKeyChecking=accept-new "root@$HOST" "redeploy lumee ${GITHUB_SHA::7}"
