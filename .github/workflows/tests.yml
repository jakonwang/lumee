# Runs the backend (PHPUnit) and admin (Vitest + type check) tests on every push and pull request.
# Separate from makeserver.yml (generated by makeserver, which deploys) so regenerating that file doesn't remove the tests.
name: tests

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: gd, intl, zip, bcmath, exif, pdo_sqlite
          coverage: none
      - name: Composer cache
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: composer-${{ hashFiles('backend/composer.lock') }}
      - run: composer install --no-interaction --no-progress --prefer-dist
      - run: cp .env.example .env && php artisan key:generate
      - run: vendor/bin/phpunit

  admin:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: admin/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - name: Type check
        run: npx vue-tsc -b
